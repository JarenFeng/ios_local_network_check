name: ios_local_network_check
description: "Checks the iOS Local Network permission with a TCP or UDP endpoint."
version: 0.0.1

environment:
  sdk: ^3.7.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IosLocalNetworkCheckPlugin
